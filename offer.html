<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cashback Offer Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #fff;
      color: #000;
      font-family: Arial;
    }

    .box {
      border: 1px solid #000;
      padding: 30px;
      margin-top: 50px;
    }

    .btn-black {
      background: #000;
      color: #fff;
      border: none;
      padding: 10px 20px;
    }

    .btn-black:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box text-center">
    <h2 id="title">Offer</h2>
    <p id="desc"></p>

    <h4 id="coupon"></h4>

    <button class="btn-black mt-3" onclick="useCoupon()">Use This Coupon</button>

    <p id="msg" class="mt-3"></p>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const type = params.get("type");

  const offers = {
    instant10: {
      title: "10% Instant Cashback",
      desc: "Get 10% cashback on orders above ₹999.",
      coupon: "INSTANT10"
    },
    buy2: {
      title: "Buy 2 Get Cashback",
      desc: "Get ₹200 cashback on combo orders.",
      coupon: "BUY2GET200"
    },
    weekend: {
      title: "Weekend Cashback Deal",
      desc: "Flat cashback on weekend shopping.",
      coupon: "WEEKEND15"
    },
    app: {
      title: "App Exclusive Cashback",
      desc: "Extra cashback on mobile orders.",
      coupon: "APP5"
    },
    student: {
      title: "Student Cashback Offer",
      desc: "Special cashback for students.",
      coupon: "STUDENT20"
    },
    delivery: {
      title: "Free Delivery Cashback",
      desc: "Cashback equal to delivery charges.",
      coupon: "FREEDEL"
    }
  };

  const offer = offers[type];

  if (!offer) {
    document.getElementById("title").innerText = "Offer Not Found";
    document.getElementById("desc").innerText = "Invalid or missing offer type.";
    document.getElementById("coupon").innerText = "";
  } else {
    document.getElementById("title").innerText = offer.title;
    document.getElementById("desc").innerText = offer.desc;
    document.getElementById("coupon").innerText = "Coupon: " + offer.coupon;
  }

  function useCoupon() {
    if (!offer) return;
    localStorage.setItem("coupon", offer.coupon);
    document.getElementById("msg").innerText =
      "Coupon applied successfully!";
  }
</script>

</body>
</html>
