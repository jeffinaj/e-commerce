  <style>

      font-family: Arial;
      color: #000;

    }

      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .item:hover {
      border: 1px solid #000;
    }
  </style>
</head>

</a>
    </div>

    <div class="col-md-3">
      <a href="girls.html" class="cat-link">

    </div>

    <div class="col-md-3">
      <a href="men.html" class="cat-link">
